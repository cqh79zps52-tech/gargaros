[workspace]
members = ["protocol", "core", "napi", "cli"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Gargaros contributors"]
repository = "https://github.com/cqh79zps52-tech/gargaros"

[workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
] }
tokio = { version = "1", features = ["full"] }
zerocopy = { version = "0.7", features = ["derive"] }
bitflags = "2"
crossbeam-channel = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
webp = "0.3"
fast_image_resize = "5"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
panic = "abort"
debug = "line-tables-only"

[profile.dev]
opt-level = 1
debug = true
